name: BharatBeacon Daily Tech Masterclass Automation

on:
  schedule:
    # Runs daily at 8:00 PM IST (14:30 UTC) to generate and schedule the next day's 24 episodes
    - cron: '30 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily_tech:
    name: Produce & Schedule Daily Tech Courses
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure YouTube API Credentials
        run: |
          echo "$YOUTUBE_CLIENT_SECRETS" > client_secrets.json
          echo "$YOUTUBE_TOKEN_JSON" > token.json
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

      - name: Execute Daily Tech Masterclass Pipeline
        run: |
          python run_daily_tech.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit & Push Updated Tracker
        run: |
          git config --global user.name "BharatBeacon Automation Bot"
          git config --global user.email "bot@bharatbeacon.com"
          git add output/current_day_tracker.json
          git commit -m "Update tech bootcamp day tracker [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"

      - name: Upload Run Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-tech-logs-${{ github.run_id }}
          path: |
            output/logs/
            output/current_day_tracker.json
          if-no-files-found: ignore
